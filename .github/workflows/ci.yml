name: ci

# Pushes to main and pull requests; a branch with an open PR runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # The worktree and end-to-end tests create real commits.
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci && git config --global init.defaultBranch main
      - run: npm test

  validate:
    name: validate plugin and marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Pinned so a new Claude Code release cannot turn CI red on its own; bump it on purpose.
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - run: npm run validate
